name: Build and Deploy InfoAidTech App

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'generate-sitemap.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  deploy-cpanel:
    name: Deploy InfoAidTech to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build InfoAidTech project
        run: npm run build

      - name: Prepare SPA routing (.htaccess & index.html fallback)
        run: |
          # Ensure index.html exists for Apache if generated as index.csr.html
          if [ -f ./dist/infoAidTech/browser/index.csr.html ] && [ ! -f ./dist/infoAidTech/browser/index.html ]; then
            cp ./dist/infoAidTech/browser/index.csr.html ./dist/infoAidTech/browser/index.html
          fi

          # Create .htaccess for Apache SPA HTML5 History mode rewrite on cPanel
          cat << 'EOF' > ./dist/infoAidTech/browser/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Force HTTPS
            RewriteCond %{HTTPS} !=on
            RewriteCond %{HTTP:X-Forwarded-Proto} !https
            RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>

          # Enable Gzip / Deflate compression for text, html, js, css, xml
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css application/xml application/xhtml+xml application/rss+xml application/javascript application/x-javascript application/json
          </IfModule>

          # Set browser caching headers
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/jpg "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType application/x-javascript "access plus 1 year"
            ExpiresByType text/javascript "access plus 1 year"
            ExpiresByType application/json "access plus 0 seconds"
            ExpiresByType text/html "access plus 0 seconds"
          </IfModule>
          EOF

          # Create tmp/restart.txt in both root and infoAidTech to signal cPanel Passenger/LiteSpeed to restart Node.js
          mkdir -p ./dist/tmp ./dist/infoAidTech/tmp
          date +%s > ./dist/tmp/restart.txt
          date +%s > ./dist/infoAidTech/tmp/restart.txt

          # Copy .htaccess to root and infoAidTech so LiteSpeed detects configuration changes
          cp ./dist/infoAidTech/browser/.htaccess ./dist/.htaccess || true
          cp ./dist/infoAidTech/browser/.htaccess ./dist/infoAidTech/.htaccess || true

      - name: Sync files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./

      - name: Clear GitHub Actions caches & artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Purging artifacts and caches to keep GitHub storage under limit..."
          # Delete any stored artifacts for this repository
          gh api -X GET "repos/$REPO/actions/artifacts" --jq '.artifacts[].id' 2>/dev/null | while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting artifact ID: $id"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" 2>/dev/null || true
            fi
          done

          # Delete all actions caches for this repository
          gh api -X GET "repos/$REPO/actions/caches" --jq '.actions_caches[].id' 2>/dev/null | while read -r cache_id; do
            if [ -n "$cache_id" ]; then
              echo "Deleting cache ID: $cache_id"
              gh api -X DELETE "repos/$REPO/actions/caches/$cache_id" 2>/dev/null || true
            fi
          done
          echo "Storage cleanup complete."
