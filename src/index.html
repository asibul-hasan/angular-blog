    <!-- Deferred Google Analytics loader to eliminate render blocking and reduce TBT on initial mobile load -->
    <script>
      // Initialize dataLayer and gtag stub to buffer tracking calls without blocking initial page render
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-HSYBWMWFWR");

      // Guard flag to guarantee gtag.js script is injected exactly once
      var gtagLoaded = false;
      function loadGtag() {
        if (gtagLoaded) return;
        gtagLoaded = true;

        var script = document.createElement('script');
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-HSYBWMWFWR";
        script.async = true;
        document.head.appendChild(script);
      }

      // Defer gtag injection until first real user interaction to protect mobile performance metrics
      ['scroll', 'pointerdown', 'keydown', 'touchstart'].forEach(function(evt) {
        window.addEventListener(evt, loadGtag, { once: true, passive: true });
      });

      // Fallback injection 5 seconds after window load if no interaction has occurred
      window.addEventListener('load', function() {
        setTimeout(loadGtag, 5000);
      });
    </script>
