<!-- Enterprise Dashboard Container -->
<div class="space-y-6 w-full animate-in fade-in duration-300">
  <!-- Layer 1: Enterprise Header -->
  <app-dashboard-header
    [userName]="userName()"
    [userRole]="userRole()"
    [currentTimeframe]="currentTimeframe()"
    (timeframeChange)="onTimeframeChange($event)"
  ></app-dashboard-header>

  <!-- Layer 2: Tier 1 High-Density KPI Cards (5 Cards) -->
  <section aria-label="Key Performance Indicators">
    <app-dashboard-stat-cards
      [metrics]="metrics()"
    ></app-dashboard-stat-cards>
  </section>

  <!-- Layer 3: Visual Analytics Grid (8-col Velocity | 4-col Domain Breakdown) -->
  <section aria-label="Visual Analytics & Velocity">
    <app-dashboard-charts
      [domainData]="domainDistribution()"
      [blogCount]="metrics().publishedBlogs"
      [internCount]="metrics().activeInterns"
      [applicationsCount]="metrics().totalApplications"
      [gaDailyTrajectory]="gaDailyTrajectory()"
      [gaTotalViews]="metrics().totalViews"
      [gaActiveUsers]="gaActiveUsers()"
      [gaEngagementRate]="metrics().engagementRate"
      [gaStatus]="gaStatus()"
    ></app-dashboard-charts>
  </section>

  <!-- Layer 4: Operational Review Queue & Quick Actions Pad (8-col Queue | 4-col Actions) -->
  <section aria-label="Operational Action Queue and Shortcuts">
    <app-dashboard-queue
      [pendingTasks]="pendingTasks()"
      [jobApplications]="jobApplications()"
      [editorialDrafts]="editorialDrafts()"
    ></app-dashboard-queue>
  </section>

  <!-- Layer 5: Content Intelligence & Security Telemetry (6-col Trending | 6-col Sessions) -->
  <section aria-label="Content Performance and Security Sessions">
    <app-dashboard-telemetry
      [topPages]="topPages()"
      [trafficSources]="trafficSources()"
      [trendingArticles]="trendingArticles()"
      [sessions]="sessions()"
    ></app-dashboard-telemetry>
  </section>
</div>
